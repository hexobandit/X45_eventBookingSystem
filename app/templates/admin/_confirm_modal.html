<!-- Global Confirmation Modal -->
<div class="manage-overlay" id="confirmModal">
    <div class="manage-modal" style="max-width:420px;">
        <div class="manage-modal-head">
            <h5 id="confirmTitle">Confirmation</h5>
            <button type="button" class="manage-modal-close" id="confirmCloseX">&times;</button>
        </div>
        <div class="manage-modal-body">
            <p id="confirmMessage" style="margin:0;font-size:0.9rem;color:var(--admin-text-secondary);"></p>
        </div>
        <div class="manage-modal-foot">
            <button type="button" class="btn btn-secondary btn-sm" id="confirmCancelBtn">Cancel</button>
            <button type="button" class="btn btn-primary btn-sm" id="confirmOkBtn">Confirm</button>
        </div>
    </div>
</div>
<script>
(function(){
    var modal = document.getElementById('confirmModal');
    var msgEl = document.getElementById('confirmMessage');
    var okBtn = document.getElementById('confirmOkBtn');
    var pendingCallback = null;

    window.showConfirm = function(message, onConfirm) {
        pendingCallback = onConfirm;
        msgEl.textContent = message;
        modal.classList.add('active');
    };

    window.confirmAction = function(formOrBtn, message) {
        var form;
        if (formOrBtn.tagName === 'BUTTON' || formOrBtn.tagName === 'INPUT') {
            form = formOrBtn.closest('form');
        } else {
            form = formOrBtn;
        }
        window.showConfirm(message, function(){
            // Remove any onclick confirmAction to prevent loop
            var submitBtn = form.querySelector('[type="submit"]');
            if (submitBtn) submitBtn.removeAttribute('onclick');
            form.submit();
        });
        return false;
    };

    var box = modal.querySelector('.manage-modal');

    function closeModal() {
        modal.classList.remove('active');
        box.classList.remove('is-busy');
        if (window.setLoading) window.setLoading(okBtn, false);
        pendingCallback = null;
    }

    okBtn.addEventListener('click', function(){
        var cb = pendingCallback;
        pendingCallback = null;
        if (!cb) { closeModal(); return; }
        // Keep the dialog open with a spinner while the server works. A callback
        // that submits a form ends with navigation; one that fetches returns a
        // promise and we close when it settles.
        box.classList.add('is-busy');
        if (window.setLoading) window.setLoading(okBtn);
        var result;
        try { result = cb(); } catch (err) { closeModal(); throw err; }
        if (result && typeof result.then === 'function') {
            result.then(closeModal, closeModal);
        }
    });

    document.getElementById('confirmCloseX').addEventListener('click', closeModal);
    document.getElementById('confirmCancelBtn').addEventListener('click', closeModal);
    modal.addEventListener('mousedown', function(e){
        if (e.target === modal) closeModal();
    });
})();
</script>
